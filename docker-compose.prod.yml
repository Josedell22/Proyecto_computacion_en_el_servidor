services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: studymatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: studymatch
    volumes:
      - studymatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymatch -d studymatch"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - studymatch

  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:4000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://studymatch:${POSTGRES_PASSWORD}@db:5432/studymatch
    volumes:
      - studymatch_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - studymatch

volumes:
  studymatch_pg:
  studymatch_uploads:

networks:
  studymatch:
