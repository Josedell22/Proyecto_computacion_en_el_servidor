services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: studymatch_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: studymatch_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymatch_test -d studymatch_test"]
      interval: 2s
      timeout: 3s
      retries: 30
